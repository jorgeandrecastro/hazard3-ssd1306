
[package]
edition = "2024"
name = "hazard3-ssd1306"
version = "0.7.4"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async no_std driver for the SSD1306 OLED display over I2C, based on Hazard3."
documentation = "https://docs.rs/hazard3-ssd1306"
readme = "README.md"
keywords = ["hazard3", "ssd1306", "oled", "no-std", "hardware-support"]
categories = ["embedded", "no-std", "hardware-support"]
license = "GPL-2.0-or-later"
repository = "https://github.com/jorgeandrecastro/Hazard3"

[lib]
name = "embassy_ssd1306"
path = "src/lib.rs"

[features]
# ARM / Cortex-M: official Embassy backend
default = ["time-upstream"]
time-upstream = ["dep:embassy-time"]

# RP2350 Hazard3 RISC-V
time-riscv = ["dep:hazard3-time"]

[dependencies]
embedded-hal-async = "1.0"

embassy-time = {
    version = "0.5",
    optional = true,
    default-features = false
}

hazard3-time = {
    package = "hazard3-time",
    version = "0.1",
    optional = true,
    default-features = false
}

hazard3-time-driver = {
    package = "hazard3-time-driver",
    version = "0.1",
    optional = true,
    default-features = false
}
